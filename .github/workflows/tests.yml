name: Workbench regression
env:
  WORKBENCH_TEST_SYNTHETIC_VOICE: '1'
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Check syntax
        run: python -m compileall -q dialogue_tool tests
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run regression tests (no paid generation)
        run: python -m pytest -q

  react-desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[test]'
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure
          path: validation/*.png

  windows-cpu-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install without GPU extras
        shell: pwsh
        run: python -m pip install -e ".[test]"
      - name: Python compile check
        shell: pwsh
        run: python -m compileall -q dialogue_tool tests
      - name: Run Windows CPU smoke tests (no paid generation)
        shell: pwsh
        run: python -m pytest -q tests/test_windows_cpu.py tests/test_generation.py tests/test_desktop.py tests/test_project_run.py tests/test_dialogue_analysis.py tests/test_episode_first.py
